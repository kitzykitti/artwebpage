<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Art Portfolio</title>
    <style>
        /* --- CSS STYLES (The Look) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a; /* Dark background makes art pop */
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Container to keep things centered */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Section */
        header {
            text-align: center;
            padding: 50px 0;
            border-bottom: 1px solid #333;
        }
        h1 { margin: 0; font-size: 2.5rem; color: #ff7e5f; }
        p.subtitle { color: #aaa; font-size: 1.2rem; }

        /* Gallery Grid - Responsive */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .art-piece {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        /* This makes sure images fit the box */
        .art-piece img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        .caption {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ccc;
        }

        /* About Section */
        .about {
            margin-top: 60px;
            padding: 40px;
            background: #252525;
            border-radius: 8px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Art Webpage</h1>
            <p class="subtitle">Digital Concept Artist & Illustrator</p>
        </header>

        <nav class="site-nav" style="text-align:center; margin-top:20px;">
            <a href="cats.html" id="cats-link" target="_blank" rel="noopener noreferrer" style="color:#ff7e5f; text-decoration:none; font-weight:600;">Cats</a>
        </nav>

        <section class="about">
            <h2>About Me</h2>
            <p>Welcome to my portfolio. I am a digital artist.</p>
        </section>

        <section class="gallery">
            
            <div class="art-piece">
                <img src="pic/creatura.jpg" alt="Description of Art 1">
                <div class="caption">traditional art</div>
            </div>

            <div class="art-piece">
                <img src="pic/mink.png" alt="Description of Art 2">
                <div class="caption">character study</div>
            </div>

            <div class="art-piece">
                <img src="pic/person i drew.png" alt="Description of Art 3">
                <div class="caption">color study</div>
            </div>

        </section>

        <footer>
            &copy; 2024 Your Name. All rights reserved.
        </footer>
    </div>

    <script>
        // Ensure links and programmatic redirects to cats.html open in a new tab
        (function(){
            document.addEventListener('click', function(e){
                var a = e.target.closest && e.target.closest('a');
                if(!a) return;
                var href = a.getAttribute('href');
                if(!href) return;
                if(href.indexOf('cats.html') !== -1){
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                }
            }, true);

            var origAssign = window.location.assign;
            window.location.assign = function(url){
                if(typeof url === 'string' && url.indexOf('cats.html') !== -1){
                    window.open(url, '_blank');
                } else {
                    origAssign.call(window.location, url);
                }
            };

            var origReplace = window.location.replace;
            window.location.replace = function(url){
                if(typeof url === 'string' && url.indexOf('cats.html') !== -1){
                    window.open(url, '_blank');
                } else {
                    origReplace.call(window.location, url);
                }
            };
        })();

        document.addEventListener("contextmenu", function(e){
            // Check if the element clicked is an Image
            if (e.target.nodeName === "IMG") {
                e.preventDefault(); // Stop the menu from opening
            }
        }, false);
    </script>

</body>
</html>
